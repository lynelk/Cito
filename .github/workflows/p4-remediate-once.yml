name: P4 Gate Remediation One Shot

on:
  push:
    branches:
      - feature/commercial-founding20-embedded-p4
    paths:
      - .github/workflows/p4-remediate-once.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/commercial-founding20-embedded-p4
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Add missing stable OpenAPI operation identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Docs/Api/cito-admin-v2-openapi.yaml')
          text = path.read_text()
          replacements = {
              "  /api/v2/admin/compliance/cases:\n    get:\n      tags: [Admin Compliance]\n      summary: List actionable compliance cases":
              "  /api/v2/admin/compliance/cases:\n    get:\n      tags: [Admin Compliance]\n      operationId: listComplianceCases\n      summary: List actionable compliance cases",
              "  /api/v2/admin/compliance/cases/{id}/decision:\n    post:\n      tags: [Admin Compliance]\n      summary: Record a compliance case decision":
              "  /api/v2/admin/compliance/cases/{id}/decision:\n    post:\n      tags: [Admin Compliance]\n      operationId: decideComplianceCase\n      summary: Record a compliance case decision",
              "  /api/v2/admin/communication/routing/effective:\n    get:\n      tags: [Admin Communication Routing]\n      summary: Preview the effective communication route":
              "  /api/v2/admin/communication/routing/effective:\n    get:\n      tags: [Admin Communication Routing]\n      operationId: previewEffectiveCommunicationRoute\n      summary: Preview the effective communication route",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected OpenAPI fragment not found: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Apply canonical Spotless formatting
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Commit remediation and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p4-remediate-once.yml
          git add Docs/Api/cito-admin-v2-openapi.yaml InitializrSpringbootProjectFresh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(p4): satisfy API and formatting gates"
          git push origin HEAD:feature/commercial-founding20-embedded-p4
