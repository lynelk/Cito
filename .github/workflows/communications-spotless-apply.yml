name: Communications Spotless Apply

on:
  push:
    branches:
      - feature/communications-smart-routing
    paths:
      - 'InitializrSpringbootProjectFresh/src/**/*.java'
      - '.github/workflows/communications-spotless-apply.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/communications-smart-routing

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply repository Spotless rules
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B -q spotless:apply

      - name: Commit formatting only when required
        shell: bash
        run: |
          if git diff --quiet -- InitializrSpringbootProjectFresh/src; then
            echo "No Spotless changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InitializrSpringbootProjectFresh/src
          git commit -m "style(communications): apply Spotless formatting"
          git push origin HEAD:feature/communications-smart-routing
