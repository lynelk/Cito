name: Refresh reviewed consumer assets
on:
  push:
    branches: [feature/consumer-handover-20260912]
    paths: [.github/workflows/refresh-consumer-assets.yml]
permissions:
  contents: write
concurrency:
  group: cito-consumer-source-generation
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'lynelk/Cito'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate only the collection from its reviewed source and test linear trim
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML==6.0.2
          python scripts/consumer_api/build_package.py
          python scripts/consumer_api/build_package.py --check
          node sdk/tests/trim-regressions.cjs
          node sdk/tests/postman-regressions.cjs
          git diff --check
          test "$(git diff --name-only)" = Docs/Api/cpay-v2-postman-collection.json
      - name: Commit generated output only on unchanged feature head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/consumer-handover-20260912 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Cito reviewed asset generation'
          git config user.email 'cito-release@users.noreply.github.com'
          git add Docs/Api/cpay-v2-postman-collection.json
          git commit -m 'Regenerate consumer Postman collection with linear-time signing trim'
          gh auth setup-git
          git push origin HEAD:refs/heads/feature/consumer-handover-20260912
          echo "GENERATED_SHA=$(git rev-parse HEAD)"
          echo 'Normal PR security and handover qualification remain mandatory. No deployment performed.'
