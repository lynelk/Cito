name: API Documentation

on:
  pull_request:
    branches: ["**"]
    paths:
      - "InitializrSpringbootProjectFresh/src/main/java/**"
      - "InitializrSpringbootProjectFresh/src/main/resources/db/migration/**"
      - "Docs/Api/**"
      - "Docs/Api-v2-*.md"
      - "Docs/developer-guide.md"
      - "Docs/Error-catalog.md"
      - "Docs/Webhook-events.md"
      - "scripts/api_docs/**"
      - ".github/workflows/api-docs.yml"
  push:
    branches: ["main"]
    paths:
      - "InitializrSpringbootProjectFresh/src/main/java/**"
      - "InitializrSpringbootProjectFresh/src/main/resources/db/migration/**"
      - "Docs/Api/**"
      - "Docs/Api-v2-*.md"
      - "Docs/developer-guide.md"
      - "Docs/Error-catalog.md"
      - "Docs/Webhook-events.md"
      - "scripts/api_docs/**"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate API contracts and build references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install contract validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2

      - name: Validate CPay payments OpenAPI
        run: python scripts/api_docs/validate_openapi.py Docs/Api/cpay-v2-openapi.yaml

      - name: Validate Cito platform OpenAPI
        run: python scripts/api_docs/validate_openapi.py Docs/Api/cito-platform-v2-openapi.yaml

      - name: Validate Cito onboarding OpenAPI
        run: python scripts/api_docs/validate_openapi.py Docs/Api/cito-onboarding-v2-openapi.yaml

      - name: Validate Cito admin OpenAPI
        run: python scripts/api_docs/validate_openapi.py Docs/Api/cito-admin-v2-openapi.yaml

      - name: Validate Billing BaaS OpenAPI
        run: python scripts/api_docs/validate_openapi.py Docs/Api/billing-baas-v2-openapi.yaml

      - name: Require documentation change when API-affecting code changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/api_docs/require_docs_change.py "$BASE_SHA" "$HEAD_SHA"

      - name: Hard-gate changed controller paths against OpenAPI contracts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/api_docs/changed_controller_contract.py "$BASE_SHA" "$HEAD_SHA"
          Docs/Api/cpay-v2-openapi.yaml Docs/Api/cito-platform-v2-openapi.yaml
          Docs/Api/cito-onboarding-v2-openapi.yaml Docs/Api/cito-admin-v2-openapi.yaml
          Docs/Api/billing-baas-v2-openapi.yaml

      - name: Scan full controller/OpenAPI drift
        run: python scripts/api_docs/controller_drift.py Docs/Api/cpay-v2-openapi.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Lint CPay payments API
        run: npx --yes @redocly/cli@1.34.19 lint Docs/Api/cpay-v2-openapi.yaml --config Docs/Api/redocly.yaml

      - name: Lint Cito platform API
        run: npx --yes @redocly/cli@1.34.19 lint Docs/Api/cito-platform-v2-openapi.yaml --config Docs/Api/redocly.yaml

      - name: Lint Cito onboarding API
        run: npx --yes @redocly/cli@1.34.19 lint Docs/Api/cito-onboarding-v2-openapi.yaml --config Docs/Api/redocly.yaml

      - name: Lint Cito admin API
        run: npx --yes @redocly/cli@1.34.19 lint Docs/Api/cito-admin-v2-openapi.yaml --config Docs/Api/redocly.yaml

      - name: Lint Billing BaaS API
        run: npx --yes @redocly/cli@1.34.19 lint Docs/Api/billing-baas-v2-openapi.yaml --config Docs/Api/redocly.yaml

      - name: Build browsable API references
        run: |
          mkdir -p build/api-docs
          npx --yes @redocly/cli@1.34.19 build-docs Docs/Api/cpay-v2-openapi.yaml -o build/api-docs/cpay-payments.html
          npx --yes @redocly/cli@1.34.19 build-docs Docs/Api/cito-platform-v2-openapi.yaml -o build/api-docs/cito-platform.html
          npx --yes @redocly/cli@1.34.19 build-docs Docs/Api/cito-onboarding-v2-openapi.yaml -o build/api-docs/cito-onboarding.html
          npx --yes @redocly/cli@1.34.19 build-docs Docs/Api/cito-admin-v2-openapi.yaml -o build/api-docs/cito-admin.html
          npx --yes @redocly/cli@1.34.19 build-docs Docs/Api/billing-baas-v2-openapi.yaml -o build/api-docs/billing-baas.html
          printf '%s\n' "${GITHUB_SHA}" > build/api-docs/source-commit.txt
          cp Docs/developer-guide.md build/api-docs/developer-guide.md
          cp Docs/Api/AUTO_UPDATE_POLICY.md build/api-docs/AUTO_UPDATE_POLICY.md
          cp Docs/Api/README.md build/api-docs/README.md

      - name: Upload generated API reference
        uses: actions/upload-artifact@v7
        with:
          name: cito-api-reference-${{ github.sha }}
          path: build/api-docs/
          if-no-files-found: error
          retention-days: 30
