name: Temporary MTN Spotless Formatter

on:
  push:
    branches:
      - fix/mtn-callback-correlation
    paths:
      - .github/workflows/temp-mtn-spotless.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MTN branch
        uses: actions/checkout@v7
        with:
          ref: fix/mtn-callback-correlation
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply repository Spotless rules
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/gateway/MtnMomoCorrelationService.java \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/gateway/MtnMomoStatusClient.java \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/gateway/MtnMomoAdapter.java \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/scheduler/MtnMomoStatusPollingScheduler.java \
            InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/gateway/MtnMomoStatusClientTest.java
          git commit -m "Apply Spotless formatting to MTN changes"
          git push origin HEAD:fix/mtn-callback-correlation
