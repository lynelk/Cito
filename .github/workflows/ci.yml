name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

env:
  DB_URL: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1"
  DB_USERNAME: sa
  DB_PASSWORD: ""
  MAIL_USERNAME: noreply@example.com
  MAIL_PASSWORD: ""
  LOCK_FILE_DIR: /tmp/cpay/locks
  ACTUATOR_USERNAME: ci-actuator
  ACTUATOR_PASSWORD: ci-actuator-password
  ADMIN_API_USERNAME: ci-admin
  ADMIN_API_PASSWORD: ci-admin-password
  CALLBACK_SIGNING_SECRET: ci-callback-secret

jobs:
  backend:
    name: Backend - Build, Test and Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Compile, test and verify
        run: mvn -B verify --no-transfer-progress -Dspring.flyway.enabled=false
      - name: Verify packaged jar contains its startup dependencies
        run: |
          set -euo pipefail
          jar tf target/cito-fresh-*.jar > /tmp/cpay-jar-contents.txt
          grep -q "BOOT-INF/lib/logstash-logback-encoder-" /tmp/cpay-jar-contents.txt
      - name: Generate backend SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom --no-transfer-progress -DskipTests
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: InitializrSpringbootProjectFresh/target/surefire-reports/
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom
          path: |
            InitializrSpringbootProjectFresh/target/bom.json
            InitializrSpringbootProjectFresh/target/bom.xml

  migration-smoke:
    name: Migration Naming and Duplicate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Flyway migration versions are unique
        run: |
          set -euo pipefail
          files=$(find InitializrSpringbootProjectFresh/src/main/resources/db/migration -type f -name 'V*.sql' -printf '%f\n' | sort)
          echo "$files"
          versions=$(echo "$files" | sed -E 's/^V([0-9]+)__.*/\1/')
          dupes=$(echo "$versions" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate Flyway versions found: $dupes" >&2
            exit 1
          fi
          for migration in V54__compliance_kyb_kyc_foundation.sql V55__regional_cross_border_foundation.sql V61__finance_operations_foundation.sql V62__product_polish_developer_experience_foundation.sql V63__production_maturity_execution_automation.sql; do
            test -s "InitializrSpringbootProjectFresh/src/main/resources/db/migration/$migration"
          done
          ! grep -R -Ei 'BIGSERIAL|JSONB|::jsonb|ON CONFLICT|RETURNING|CREATE INDEX IF NOT EXISTS' \
            InitializrSpringbootProjectFresh/src/main/resources/db/migration/V54__compliance_kyb_kyc_foundation.sql \
            InitializrSpringbootProjectFresh/src/main/resources/db/migration/V55__regional_cross_border_foundation.sql \
            InitializrSpringbootProjectFresh/src/main/resources/db/migration/V61__finance_operations_foundation.sql \
            InitializrSpringbootProjectFresh/src/main/resources/db/migration/V62__product_polish_developer_experience_foundation.sql \
            InitializrSpringbootProjectFresh/src/main/resources/db/migration/V63__production_maturity_execution_automation.sql

  mysql-migration:
    name: MySQL 8.4 Migration and Payment Lifecycle
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cpayadmin
          MYSQL_USER: cpay
          MYSQL_PASSWORD: cpay-ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Enable binary-log-safe V28 trigger creation
        working-directory: .
        run: |
          set -euo pipefail
          MYSQL_CONTAINER=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -n1)
          test -n "$MYSQL_CONTAINER"
          docker exec "$MYSQL_CONTAINER" \
            mysql -uroot -proot-ci-password \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"
          test "$(docker exec "$MYSQL_CONTAINER" mysql -uroot -proot-ci-password -NBe 'SELECT @@GLOBAL.log_bin_trust_function_creators')" = "1"
      - name: Apply migrations and verify fake-provider accounting and recovery
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/cpayadmin?allowPublicKeyRetrieval=true&useSSL=false
          DB_USERNAME: cpay
          DB_PASSWORD: cpay-ci-password
          ACTUATOR_USERNAME: ci-actuator
          ACTUATOR_PASSWORD: ci-actuator-password
          ADMIN_API_USERNAME: ci-admin
          ADMIN_API_PASSWORD: ci-admin-password
          CALLBACK_SIGNING_SECRET: ci-callback-secret
          MERCHANT_CHANNEL_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLWtleQ==
          CPAY_KEY_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLWtleQ==
        run: mvn -B test --no-transfer-progress -Dtest=FlywayMigrationSmokeTest

  api-contract:
    name: API Contract Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate OpenAPI contract is present
        run: |
          test -s Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/native/payments/collect" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/payments/payout" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/payment-links" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/checkout/{token}/pay" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/invoices" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/invoices/pay/{token}" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/channels" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/payments/{reference}" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/balances" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/merchant-self-service/batches/{batchId}" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/merchant-self-service/webhooks" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/admin/recon-finance/summary" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/admin/compliance/cases" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/admin/provider-certification/evidence" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/admin/finance-operations/settlements" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/cross-border/transfers" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/production-maturity/screening/requests" Docs/Api/cpay-v2-openapi.yaml
          grep -q "/api/v2/production-maturity/settlements/finance/{settlementBatchId}/post" Docs/Api/cpay-v2-openapi.yaml
          python - <<'PY'
          import yaml
          with open('Docs/Api/cpay-v2-openapi.yaml', encoding='utf-8') as fh:
              spec = yaml.safe_load(fh)
          assert spec.get('openapi')
          assert '/api/v2/native/payments/collect' in spec['paths']
          assert '/api/v2/production-maturity/screening/requests' in spec['paths']
          PY

  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run OWASP Dependency-Check
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DnvdDatafeedUrl="https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz" \
            -Dformat=HTML \
            --no-transfer-progress
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: InitializrSpringbootProjectFresh/target/dependency-check-report.html

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build for CodeQL
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B compile --no-transfer-progress -DskipTests
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          # Default setup owns repository uploads; a second advanced upload is
          # rejected. Execute all extended queries and enforce findings locally.
          upload: never
          output: codeql-results
      - name: Enforce high and critical CodeQL findings
        run: python3 ops/release/check_codeql_sarif.py codeql-results
      - name: Retain complete CodeQL findings for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-security-extended-${{ github.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: error

  frontend:
    name: Frontend - Install and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientside
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clientside/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run linter
        run: npm run lint --if-present
      - name: Run tests
        run: npm test
        env:
          CI: "true"
          NODE_OPTIONS: "--openssl-legacy-provider"
      - name: Run WCAG experience regression
        run: npx vitest run src/ui/ExperienceStates.test.tsx
      - name: Run typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: "--openssl-legacy-provider"
      - name: Build React app
        run: npm run build
        env:
          CI: "false"
          NODE_OPTIONS: "--openssl-legacy-provider"

  readiness-summary:
    name: Readiness Gate Summary
    runs-on: ubuntu-latest
    needs: [backend, migration-smoke, mysql-migration, api-contract, owasp, codeql, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Confirm production readiness checklist exists
        run: |
          test -s Docs/Readiness/Market-readiness-gates.md
          test -s Docs/Runbooks/Production-incident-response.md
          test -s Docs/Runbooks/Provider-certification-checklist.md
          test -s Docs/Runbooks/Operations-alerts.md
          test -s Docs/Runbooks/Callback-security-and-requeue.md
          test -s Docs/Runbooks/Reconciliation-finance-daily-close.md
          test -s Docs/Runbooks/Merchant-activation-and-support.md
          test -s Docs/Runbooks/Provider-incidents-and-public-status.md
          test -s Docs/Architecture/Overview.md
          test -s Docs/Product/Unified-product-experience.md
          test -s Docs/Observability/Product-experience-KPIs.md
          test -s Docs/Production-code-controls.md
          test -s Docs/Readiness/Market-readiness-tracker.md
