name: Cito canonical remediation review candidate
on:
  push:
    branches: [feature/cito-canonical-recovery-readiness-20260911]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cito-canonical-remediation-candidate
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cpayadmin
          MYSQL_USER: cpay
          MYSQL_PASSWORD: cpay-ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GH_TOKEN: ${{ github.token }}
      DB_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
      DB_USERNAME: sa
      DB_PASSWORD: ''
      MAIL_USERNAME: noreply@example.com
      MAIL_PASSWORD: ''
      LOCK_FILE_DIR: /tmp/cpay/locks
      ACTUATOR_USERNAME: ci-actuator
      ACTUATOR_PASSWORD: ci-actuator-password
      ADMIN_API_USERNAME: ci-admin
      ADMIN_API_PASSWORD: ci-admin-password
      CALLBACK_SIGNING_SECRET: ci-callback-secret
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clientside/package-lock.json
      - name: Apply explicitly reviewed canonical integration
        run: |
          set -euo pipefail
          python3 ops/release/canonical_assembly_v2.py
          python3 -m pip install --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2 markdown2==2.5.4
          python3 scripts/api_docs/build_portal_reference.py
          python3 scripts/api_docs/build_portal_reference.py --check
          python3 scripts/api_docs/test_portal_reference.py
          python3 Docs/Brand/check_brand.py
      - name: Backend formatter and full verification
        working-directory: InitializrSpringbootProjectFresh
        run: |
          mvn -B spotless:apply verify --no-transfer-progress -Dspring.flyway.enabled=false > /tmp/canonical-backend.log 2>&1 || { tail -140 /tmp/canonical-backend.log; exit 1; }
          tail -20 /tmp/canonical-backend.log
      - name: Fresh populated MySQL migrations and actual financial invariants
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/cpayadmin?allowPublicKeyRetrieval=true&useSSL=false
          DB_USERNAME: cpay
          DB_PASSWORD: cpay-ci-password
          MERCHANT_CHANNEL_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLWtleQ==
          CPAY_KEY_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLWtleQ==
        run: |
          set -euo pipefail
          id=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -1)
          docker exec "$id" mysql -uroot -proot-ci-password -e 'SET GLOBAL log_bin_trust_function_creators=1;'
          cd InitializrSpringbootProjectFresh
          mvn -B test --no-transfer-progress -Dtest=FlywayMigrationSmokeTest > /tmp/canonical-mysql.log 2>&1 || { tail -160 /tmp/canonical-mysql.log; exit 1; }
          tail -25 /tmp/canonical-mysql.log
      - name: Restart, competing replica, expired worker and billing evidence tests
        working-directory: InitializrSpringbootProjectFresh
        run: |
          mvn -B test --no-transfer-progress -Ddocker.tests.excludedGroups= '-Dtest=MobileMoneyRecoveryLeaseStoreTestcontainersTest,DoubleEntryLedgerServiceTestcontainersTest,*Billing*TestcontainersTest,*Outbox*TestcontainersTest,ChargeShadowComparisonServiceTestcontainersTest,RatedChargeRepositoryTestcontainersTest,UsagePaymentReconciliationServiceTestcontainersTest,PaymentPipelineReconciliationTestcontainersTest' > /tmp/canonical-docker.log 2>&1 || { tail -160 /tmp/canonical-docker.log; exit 1; }
          tail -25 /tmp/canonical-docker.log
      - name: Frontend typecheck, lint, tests and production build
        working-directory: clientside
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund > /tmp/canonical-frontend.log 2>&1
          for cmd in typecheck lint test build; do
            npm run "$cmd" >> /tmp/canonical-frontend.log 2>&1 || { tail -120 /tmp/canonical-frontend.log; exit 1; }
          done
          tail -25 /tmp/canonical-frontend.log
      - name: Publish tested review candidate without changing any release ref
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = de3011367b67eac2cad65e508e72966a3f70b5ea
          git diff --check
          git config user.name 'Cito canonical remediation'
          git config user.email 'remediation@users.noreply.github.com'
          # Assembly helpers are audit history on the source branch, not application release files.
          git rm .github/workflows/canonical-remediation-review.yml ops/release/complete_canonical_remediation.py ops/release/canonical_candidate_checks.py ops/release/canonical_assembly_v2.py
          git add -A
          git commit -m 'Complete canonical recovery fencing, truthful readiness and safe developer onboarding'
          branch="release/canonical-remediation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          echo "CANDIDATE_BRANCH=$branch"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
      - name: Preserve source and honest diagnostic evidence
        if: always()
        run: |
          mkdir -p /tmp/canonical-evidence
          git diff --binary > /tmp/canonical-evidence/worktree.patch
          git ls-files -z | tar --null -T - -czf /tmp/canonical-evidence/tracked-source.tar.gz
          cp /tmp/canonical-*.log /tmp/canonical-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canonical-remediation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/canonical-evidence/
            InitializrSpringbootProjectFresh/target/surefire-reports/
          retention-days: 7
