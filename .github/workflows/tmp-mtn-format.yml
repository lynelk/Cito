name: Temporary MTN lifecycle formatter

on:
  push:
    branches:
      - feature/mtn-momo-collections-payout-hardening

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-mtn-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mtn-momo-collections-payout-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply canonical Java formatting
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Advance reviewed financial-control objective
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('ops/iso/governance.json')
          data = json.loads(path.read_text())
          for objective in data.get('objectives', []):
              if objective.get('id') == 'OBJ-FIN-01':
                  objective['nextReviewAt'] = '2026-12-09'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/Model/TransactionStatus.java \
                  InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/ledger/PaymentLedgerSettlementService.java \
                  InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/scheduler/MtnMomoStatusPollScheduler.java \
                  InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/gateway/MtnMomoCredentialSchemaTest.java \
                  InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/ledger/PaymentLedgerSettlementServiceTest.java \
                  InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/scheduler/TransactionTimeoutSchedulerTest.java \
                  ops/iso/governance.json
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
          else
            git commit -m 'Format MTN lifecycle hardening [skip-mtn-format]'
            git push origin HEAD:feature/mtn-momo-collections-payout-hardening
          fi
