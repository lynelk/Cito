name: Debug First Admin Spotless
on:
  push:
    branches: ["fix/first-admin-bootstrap-20260908"]
permissions:
  contents: read
jobs:
  spotless-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply formatter
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-initial-admin-bootstrap
          path: InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/security/InitialAdminBootstrap.java
          if-no-files-found: error
          retention-days: 1
