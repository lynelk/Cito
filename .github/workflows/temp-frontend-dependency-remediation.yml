name: Temporary frontend dependency remediation

on:
  push:
    branches:
      - security/frontend-dependency-remediation-20260909

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clientside
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: security/frontend-dependency-remediation-20260909
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: clientside/package-lock.json

      - name: Install current locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply non-breaking audit fixes
        shell: bash
        run: |
          set +e
          npm audit fix --legacy-peer-deps
          rc=$?
          set -e
          echo "npm audit fix exit code: ${rc}; continuing because remaining findings require the targeted Vitest upgrade below."

      - name: Upgrade Vitest family past GHSA-82fw-gwwq-j7x9
        run: npm install --save-dev vitest@4.1.11 @vitest/coverage-v8@4.1.11 --legacy-peer-deps

      - name: Verify no moderate-or-higher audit findings remain
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Coverage run
        run: npm run test:coverage

      - name: Commit generated dependency files and remove temporary workflow
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-frontend-dependency-remediation.yml
          git add clientside/package.json clientside/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security(deps): remediate frontend audit findings [skip ci]"
          git push origin HEAD:security/frontend-dependency-remediation-20260909
