name: P0 Hotfix Spotless Formatter

on:
  push:
    branches:
      - fix/live-compliance-cases-schema-159

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-compliance-cases-schema-159
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository formatter
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Remove one-shot formatter
        run: rm .github/workflows/p0-hotfix-spotless.yml
      - name: Commit canonical formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/ComplianceKybKycController.java InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/ComplianceKybKycControllerComplianceCasesTest.java .github/workflows/p0-hotfix-spotless.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(compliance): apply canonical Spotless formatting'
          git push origin HEAD:fix/live-compliance-cases-schema-159
