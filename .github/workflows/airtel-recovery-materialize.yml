name: Airtel recovery candidate validation
on:
  push:
    branches: [feature/airtel-recovery-completion-20260910]
    paths: ['.ci/airtel-recovery/**', '.github/workflows/airtel-recovery-materialize.yml']
permissions:
  contents: write
concurrency:
  group: airtel-recovery-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify and materialize reviewed source
        run: |
          set -euo pipefail
          cat .ci/airtel-recovery/0{0,1,2,3} | gzip -dc > /tmp/airtel-recovery.patch
          echo 'a578b1358f230a5a06df6c7f2324033d00c6828be040c473e789ad01cecc60eb  /tmp/airtel-recovery.patch' | sha256sum -c -
          git apply --check /tmp/airtel-recovery.patch
          git apply /tmp/airtel-recovery.patch
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format candidate
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B -ntp spotless:apply
      - name: Commit candidate to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .ci/airtel-recovery .github/workflows/airtel-recovery-materialize.yml
          git add InitializrSpringbootProjectFresh Docs/Operations
          git diff --cached --check
          git commit -m 'Implement durable Airtel recovery across legacy and native payment paths'
          git push origin HEAD:refs/heads/feature/airtel-recovery-completion-20260910
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git archive --format=tar.gz -o evidence/source.tar.gz HEAD
      - name: Full default backend verification
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B -ntp verify
      - name: Real MySQL recovery and ledger tests
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B -ntp -Ddocker.tests.excludedGroups= -Dtest=AirtelRecoveryStoreTestcontainersTest,DoubleEntryLedgerServiceTestcontainersTest test
      - name: Export source and actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airtel-recovery-candidate-evidence
          path: |
            evidence
            InitializrSpringbootProjectFresh/target/surefire-reports
          retention-days: 7
