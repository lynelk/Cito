name: Frontend Backend Delivery Parity

on:
  pull_request:
    branches:
      - main
      - production
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  parity-and-environment-contract:
    name: Validate delivery parity and environment contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate environment and PR parity contract
        run: python3 ops/release/validate_delivery_parity.py --event "$GITHUB_EVENT_PATH"
