name: PR 203 release preflight

on:
  push:
    branches: [feature/platform-10-10-20260912]
    paths: [.github/workflows/platform-203-preflight.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: platform-203-preflight
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'lynelk/Cito'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel only superseded PR 203 verification runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/lynelk/Cito'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          pr = api('/pulls/203')
          if pr['state'] != 'open' or pr['head']['ref'] != 'feature/platform-10-10-20260912':
              raise SystemExit('PR scope changed; no runs cancelled')
          latest = pr['head']['sha']
          allowed = {'CI', 'API Documentation', 'Docs Site', 'Docker Build (PR)', 'Billing Convergence Gates', 'Browser and Responsive Matrix', 'ISO Governance and Financial Messaging', 'Frontend Experience Quality Gates', 'Brand governance', 'Communications Release Gates', 'Cito Security Containment', 'Canonical recovery invariants', 'Frontend Backend Delivery Parity', 'Cito Exact-Head Release Verification'}
          candidates = []
          for page in range(1, 11):
              runs = api('/actions/runs?branch=feature%2Fplatform-10-10-20260912&per_page=100&page=' + str(page))['workflow_runs']
              candidates.extend(run for run in runs if run['event'] == 'pull_request' and run['head_sha'] != latest and run['status'] != 'completed' and run['name'] in allowed and any(item['number'] == 203 for item in run.get('pull_requests', [])))
              if len(runs) < 100:
                  break
          cancelled = 0
          for run in candidates:
              try:
                  api('/actions/runs/' + str(run['id']) + '/cancel', 'POST')
                  cancelled += 1
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
          print('Superseded verification cancellations requested:', cancelled)
          print('Preserved current PR head:', latest)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Archive tracked source without secrets or build output
        run: |
          mkdir -p /tmp/platform-203-preflight
          git archive --format=tar.gz -o /tmp/platform-203-preflight/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/platform-203-preflight/source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: platform-203-source-${{ github.sha }}
          path: /tmp/platform-203-preflight/
          retention-days: 7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Produce formatting evidence without modifying GitHub source
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Retain exact formatting patch
        if: always()
        run: |
          git diff --binary > /tmp/platform-203-preflight/formatting.patch
          git diff --stat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platform-203-formatting-${{ github.sha }}
          path: /tmp/platform-203-preflight/formatting.patch
          retention-days: 7
