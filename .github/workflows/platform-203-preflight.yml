name: PR 203 release preflight

on:
  push:
    branches: [feature/platform-10-10-20260912]
    paths: [.github/workflows/platform-203-preflight.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: platform-203-preflight
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'lynelk/Cito' && github.ref == 'refs/heads/feature/platform-10-10-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel only superseded verification runs for this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/lynelk/Cito'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers, method=method), timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          pr = api('/pulls/203')
          if pr['state'] != 'open' or pr['head']['ref'] != 'feature/platform-10-10-20260912' or pr['head']['repo']['full_name'] != 'lynelk/Cito' or pr['head']['sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Superseded or changed PR scope; no cancellations')
          latest = pr['head']['sha']
          allowed = {'CI', 'API Documentation', 'Docs Site', 'Docker Build (PR)', 'Billing Convergence Gates', 'Browser and Responsive Matrix', 'ISO Governance and Financial Messaging', 'Frontend Experience Quality Gates', 'Brand governance', 'Communications Release Gates', 'Cito Security Containment', 'Canonical recovery invariants', 'Frontend Backend Delivery Parity', 'Cito Exact-Head Release Verification'}
          candidates = []
          for page in range(1, 11):
              runs = api('/actions/runs?branch=feature%2Fplatform-10-10-20260912&per_page=100&page=' + str(page))['workflow_runs']
              candidates.extend(run for run in runs if run['event'] in ('pull_request', 'push') and run['head_branch'] == pr['head']['ref'] and run['head_sha'] != latest and run['status'] != 'completed' and run['name'] in allowed and (run['event'] == 'push' or any(item['number'] == 203 for item in run.get('pull_requests', []))))
              if len(runs) < 100: break
          cancelled = 0
          for run in candidates:
              try:
                  api('/actions/runs/' + str(run['id']) + '/cancel', 'POST')
                  cancelled += 1
              except urllib.error.HTTPError as error:
                  if error.code != 409: raise
          print('Superseded verification cancellations requested:', cancelled)
          print('Preserved current PR head:', latest)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Apply the existing repository formatter to changed Java files
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Exercise shared-kernel regression tests before committing formatting
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B test --no-transfer-progress -Dtest=PlatformKernelGuardTest,PlatformTransactionBoundaryTest,PlatformProviderRegistryTest,PlatformEvidenceControllerTest
      - name: Commit only formatter output on the unchanged feature head
        shell: python
        run: |
          import os, subprocess
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          changed = git('diff', '--name-only').splitlines()
          allowed = set(git('diff', '--name-only', 'origin/main...HEAD').splitlines())
          if any(path not in allowed or not path.startswith('InitializrSpringbootProjectFresh/src/') or not path.endswith('.java') for path in changed):
              raise SystemExit('Formatter changed a file outside the reviewed Java scope')
          if changed:
              expected = os.environ['GITHUB_SHA']
              current = git('ls-remote', 'origin', 'refs/heads/feature/platform-10-10-20260912').split()[0]
              if current != expected: raise SystemExit('Branch advanced; refusing formatting push')
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('add', '--', *changed)
              git('commit', '-m', 'style: normalize reviewed platform kernel and regression tests')
              git('push', 'origin', 'HEAD:refs/heads/feature/platform-10-10-20260912')
              print('Formatted source commit:', git('rev-parse', 'HEAD'))
          else: print('Reviewed source already satisfies formatter')
      - name: Retain exact tracked source and any uncommitted formatting evidence
        if: always()
        run: |
          mkdir -p /tmp/platform-203-preflight
          git archive --format=tar.gz -o /tmp/platform-203-preflight/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/platform-203-preflight/source-commit.txt
          git diff --binary > /tmp/platform-203-preflight/worktree.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platform-203-reviewed-source-${{ github.sha }}
          path: /tmp/platform-203-preflight/
          retention-days: 7
