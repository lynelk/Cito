name: Release source inspection
on:
  push:
    branches: [feature/release-promotion-20260911]
    paths: [.github/workflows/release-source-inspection.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Package tracked release sources without Git credentials
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/cito-release-source.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: cito-release-source-${{ github.sha }}
          path: ${{ runner.temp }}/cito-release-source.tar.gz
          retention-days: 2
