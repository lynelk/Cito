name: Release source inspection
on:
  push:
    branches: [feature/release-promotion-20260911]
    paths: [.github/workflows/release-source-inspection.yml, ops/release/prepare_mtn_promotion.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clientside/package-lock.json
      - name: Apply baseline-checked source corrections
        run: |
          python3 ops/release/prepare_mtn_promotion.py
          python3 scripts/api_docs/build_portal_reference.py
          python3 scripts/api_docs/build_portal_reference.py --check
          python3 Docs/Brand/check_brand.py
          git diff --check
      - name: Frontend validation
        working-directory: clientside
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Publish candidate for normal PR review
        run: |
          set -euo pipefail
          git rm .github/workflows/release-source-inspection.yml ops/release/prepare_mtn_promotion.py
          git add clientside Docs InitializrSpringbootProjectFresh/src/main/resources/api-reference Readme.md Installation.md Deployment.md CI_CD_SETUP.md
          git -c user.name='Cito Release Automation' -c user.email='86437305+lynelk@users.noreply.github.com' commit -m 'fix(mtn): unify configuration entry point and remove false readiness claims'
          git push origin HEAD:refs/heads/feature/release-promotion-20260911
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-sha.txt"
      - name: Package candidate sources
        if: always()
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/cito-release-source.tar.gz"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cito-promotion-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cito-release-source.tar.gz
            ${{ runner.temp }}/candidate-sha.txt
          retention-days: 7
