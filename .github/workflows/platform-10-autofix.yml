name: Platform 10/10 contract normalization

on:
  push:
    branches: [feature/platform-10-10-20260912]
    paths:
      - .github/workflows/platform-10-autofix.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: platform-10-autofix
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply API documentation and canonical Java formatting
        run: |
          set -euo pipefail
          python3 ops/release/platform_10_autofix.py
          cd InitializrSpringbootProjectFresh
          mvn -B spotless:apply --no-transfer-progress
          cd ..
          python3 -m pip install --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2 markdown2==2.5.4
          python3 scripts/api_docs/build_portal_reference.py
          python3 scripts/api_docs/build_portal_reference.py --check
          git diff --check
      - name: Remove one-shot normalization scaffolding and publish exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/platform-10-autofix.yml ops/release/platform_10_autofix.py
          git config user.name 'Cito platform convergence'
          git config user.email 'platform-convergence@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git commit -m 'Normalize platform contracts, API docs and formatting (#203)'
          git push origin HEAD:feature/platform-10-10-20260912
