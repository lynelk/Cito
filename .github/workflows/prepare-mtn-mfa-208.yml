name: Prepare MTN MFA PR 208
on:
  push:
    branches: [work/prepare-mtn-mfa-208]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Add the actor-specific policy to the owning admin contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Docs/Api/cito-admin-v2-openapi.yaml')
          text = p.read_text()
          endpoint = '''  /api/v2/admin/provider-treasury/live-tests/mfa-policy:
              get:
                tags: [Admin Payment Credentials]
                operationId: readProviderLiveTestMfaPolicy
                summary: Read the current operator's collection-test MFA policy
                description: >-
                  Requires an ADMIN session and LIVE_COLLECTION_TEST permission. Returns a
                  presentation hint only. The live-test POST independently enforces authenticated
                  actor, operation, provider, country, currency and expiry. A configured future
                  exception applies only to this operator's MTN production UG/UGX collection
                  tests. Real-money confirmation, merchant and credential approvals, limits,
                  idempotency and audit remain required. Login, ordinary payments, other
                  providers and payout creation/approval MFA are unchanged. No payment is made.
                responses:
                  '200':
                    description: Actor-specific policy. Missing, invalid or expired configuration requires MFA.
                    headers:
                      Cache-Control:
                        description: Prevent storage of an actor-specific temporary policy.
                        schema: {type: string, const: no-store}
                    content:
                      application/json:
                        schema:
                          type: object
                          required: [mtnCollectionMfaRequired, suspendedUntil]
                          additionalProperties: false
                          properties:
                            mtnCollectionMfaRequired:
                              type: boolean
                              description: False only for the configured authenticated operator before expiry.
                            suspendedUntil:
                              type: string
                              description: Active UTC ISO-8601 expiry, or an empty string when MFA is required.
                        example: {mtnCollectionMfaRequired: true, suspendedUntil: ''}
                  '401':
                    $ref: '#/components/responses/Unauthorized'
                  '403':
                    $ref: '#/components/responses/Forbidden'
          '''
          assert text.count('paths:\n') == 1
          assert '/api/v2/admin/provider-treasury/live-tests/mfa-policy:' not in text
          p.write_text(text.replace('paths:\n', 'paths:\n' + endpoint, 1))
          PY
      - name: Apply the existing formatter to only the three affected Java files
        run: >-
          mvn -B -f InitializrSpringbootProjectFresh/pom.xml spotless:apply
          '-DspotlessFiles=**/ProviderLiveTestService.java,**/ProviderLiveTestMfaController.java,**/ProviderLiveTestMfaPolicyTest.java'
      - name: Prepare a reviewable feature commit without changing protected branches
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/work/prepare-mtn-mfa-208
          base=eb6d90fc029403eb4e4fb9546bd3b1a167a3855f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/Api/cito-admin-v2-openapi.yaml \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/treasury/ProviderLiveTestService.java \
            InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/treasury/ProviderLiveTestMfaController.java \
            InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/treasury/ProviderLiveTestMfaPolicyTest.java
          git rm .github/workflows/prepare-mtn-mfa-208.yml
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Document the admin MFA policy and apply repository Java formatting' | git commit-tree "$tree" -p "$base")
          git diff --stat "$base" "$commit"
          git diff --name-only "$base" "$commit" | grep -v -E '^(Docs/Api/cito-admin-v2-openapi.yaml|InitializrSpringbootProjectFresh/src/(main|test)/java/net/citotech/cito/treasury/ProviderLiveTest(MfaController|MfaPolicyTest|Service).java)$' > /tmp/unexpected-files || true
          test ! -s /tmp/unexpected-files
          git push origin "$commit":refs/heads/work/mtn-mfa-formatted-208
          echo "PREPARED_COMMIT=$commit"
          echo "Prepared commit: $commit" >> "$GITHUB_STEP_SUMMARY"
