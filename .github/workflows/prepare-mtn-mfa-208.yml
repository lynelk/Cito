name: Prepare MTN MFA PR 208
on:
  push:
    branches: [work/prepare-mtn-mfa-208]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 908082a16a4d1b8e8de8041aac2bbe00e5b09f2c
      - name: Package only tracked source, never runtime credentials
        run: git archive --format=tar.gz HEAD -o /tmp/cito-mfa208-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cito-mfa208-source
          path: /tmp/cito-mfa208-source.tar.gz
          retention-days: 1
