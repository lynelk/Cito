# Read-only release attestation; this branch is never a deployment source.
name: Communications Production Attestation
on:
  push:
    branches: [verification/communications-production-20260910]
permissions:
  contents: read
jobs:
  production-public-health:
    name: Attested public production health
    # Dispatch this only after Railway reports terminal SUCCESS for the production
    # revision. The backend readiness payload must attest that same full SHA.
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check fixed public liveness and backend-readiness endpoints
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: 56811e29fb872d1e595391c169b0149f15164f38
          FRONTEND_RAILWAY_DEPLOYMENT_ID: fedddab1-a2b0-476d-b061-4b7f338c76cf
          BACKEND_RAILWAY_DEPLOYMENT_ID: fcdbf73b-4eb6-43e8-b3fe-c23b76fc3dc0
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          # GET only: no auth, cookies, customer data, provider calls or money
          # movement. TLS certificate verification uses Python's default trust.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          expected_release_sha = os.environ['EXPECTED_RELEASE_SHA'].strip()
          workflow_sha = os.environ.get('GITHUB_SHA', '').strip()
          if len(expected_release_sha) != 40 or not all(c in '0123456789abcdef' for c in expected_release_sha):
              raise SystemExit('A full immutable release SHA is required.')

          def valid_health(status, content_type, body, liveness, expected_sha=None):
              if status != 200 or not body.strip() or len(body) > 65536:
                  return False
              if 'html' in content_type.lower() or body.lstrip().startswith(b'<'):
                  return False
              if liveness:
                  return body.strip() == b'ok'
              # Reject explicit unhealthy JSON even if accidentally served 200.
              try:
                  data = json.loads(body)
              except (ValueError, UnicodeError):
                  return expected_sha is None and body.strip().lower() in (b'ok', b'up', b'healthy')
              return (
                  isinstance(data, dict)
                  and str(data.get('status', '')).upper() in ('UP', 'OK', 'HEALTHY')
                  and (expected_sha is None or data.get('release_sha') == expected_sha)
              )

          def valid_release(status, content_type, body, expected_sha):
              if status != 200 or not body.strip() or len(body) > 65536:
                  return False
              if 'html' in content_type.lower() or body.lstrip().startswith(b'<'):
                  return False
              try:
                  data = json.loads(body)
              except (ValueError, UnicodeError):
                  return False
              return isinstance(data, dict) and data.get('release_sha') == expected_sha

          # Contract checks ensure an SPA fallback or an unhealthy 200 cannot
          # be recorded as readiness. These checks perform no network traffic.
          assert valid_health(200, 'text/plain', b'ok', True)
          assert valid_health(200, 'application/json', b'{"status":"UP","release_sha":"abc"}', False, 'abc')
          assert not valid_health(200, 'text/html', b'<html>login</html>', False)
          assert not valid_health(200, 'application/json', b'{"status":"DOWN"}', False)
          assert not valid_health(200, 'application/json', b'{"status":"UP"}', False, 'abc')
          assert not valid_health(200, 'application/json', b'{"status":"UP","release_sha":"old"}', False, 'abc')
          assert not valid_health(503, 'application/json', b'{"status":"UP"}', False)
          assert not valid_health(200, 'application/json', b'{}', False)
          assert not valid_health(200, 'text/plain', b'', True)
          assert valid_release(200, 'application/json', b'{"release_sha":"abc"}', 'abc')
          assert not valid_release(200, 'application/json', b'{"release_sha":"old"}', 'abc')
          assert not valid_release(200, 'text/html', b'<html>app</html>', 'abc')

          opener = urllib.request.build_opener(NoRedirect)
          results = []
          for host in ('cito.coresynergi.es', 'cito-frontend-production.up.railway.app'):
              for path in ('/healthz', '/releasez', '/readyz', '/api/status/health'):
                  result = {'host': host, 'path': path, 'passed': False}
                  for attempt in range(1, 3):
                      started = time.monotonic()
                      result.update(attempt=attempt, http_status=None, error_type=None)
                      try:
                          request = urllib.request.Request(
                              'https://' + host + path, method='GET',
                              headers={'User-Agent': 'Cito-Release-Readiness/1.0', 'Accept': '*/*'})
                          with opener.open(request, timeout=10) as response:
                              result['http_status'] = response.status
                              content_type = response.headers.get('Content-Type', '')
                              body = response.read(65537)
                              if path == '/releasez':
                                  result['passed'] = valid_release(
                                      response.status, content_type, body, expected_release_sha)
                              else:
                                  result['passed'] = valid_health(
                                      response.status, content_type, body, path == '/healthz',
                                      None if path == '/healthz' else expected_release_sha)
                      except urllib.error.HTTPError as exc:
                          result.update(http_status=exc.code, error_type='HTTPError')
                      except (urllib.error.URLError, http.client.HTTPException,
                              TimeoutError, OSError, ValueError) as exc:
                          result['error_type'] = type(exc).__name__
                      result['elapsed_ms'] = round((time.monotonic() - started) * 1000)
                      if result['passed']:
                          break
                      if attempt == 1:
                          time.sleep(2)
                  results.append(result)
                  print(json.dumps(result, sort_keys=True))

          report = {
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'probe_workflow_sha': workflow_sha,
              'expected_release_sha': expected_release_sha,
              'railway_deployment_ids': {
                  'frontend': os.environ['FRONTEND_RAILWAY_DEPLOYMENT_ID'],
                  'backend': os.environ['BACKEND_RAILWAY_DEPLOYMENT_ID'],
              },
              'scope': 'Post-deployment public HTTP liveness plus exact frontend-build and backend-runtime SHA attestation; not authenticated UAT, provider certification, database restore or load testing.',
              'results': results,
              'passed': all(item['passed'] for item in results),
          }
          Path('cito-public-health.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Public production health (read-only)\n\n')
              summary.write(report['scope'] + '\n\n')
              summary.write('| Host | Path | HTTP | Passed | Attempts |\n|---|---|---|---|---|\n')
              for item in results:
                  summary.write(f"| {item['host']} | {item['path']} | {item['http_status']} | {item['passed']} | {item['attempt']} |\n")
          if not report['passed']:
              raise SystemExit('Public health checks failed; see sanitized evidence artifact.')
          PY

      - name: Inspect published Communications API catalogue
        run: |
          python3 - <<'PYAPI'
          import urllib.request, urllib.error, json
          url = 'https://cito.coresynergi.es/api/v3/api-docs'
          result = {'url': url, 'authenticated_uat': False}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept':'application/json'}), timeout=15) as response:
                  result['http_status'] = response.status
                  data = json.loads(response.read(10000000))
                  routes = sorted(path for path in data.get('paths', {}) if 'communication' in path)
                  result['communications_routes'] = routes
                  result['catalogue_available'] = any('notifications/catalogue' in path for path in routes)
          except urllib.error.HTTPError as error:
              result.update(http_status=error.code, catalogue_available=False, restriction='Authentication required' if error.code in (401,403) else 'HTTP error')
          except Exception as error:
              result.update(catalogue_available=False, restriction=type(error).__name__)
          print(json.dumps(result))
          open('cito-communications-api.json','w').write(json.dumps(result,indent=2)+'\n')
          PYAPI

      - name: Retain sanitized public health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cito-public-health-${{ github.run_id }}
          path: |
            cito-public-health.json
            cito-communications-api.json
          retention-days: 14
          if-no-files-found: error
