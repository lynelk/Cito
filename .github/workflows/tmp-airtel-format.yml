name: Temporary Airtel formatter

on:
  push:
    branches:
      - feature/airtel-money-openapi-hardening-v3

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-airtel-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/airtel-money-openapi-hardening-v3
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Normalize Airtel credential keys
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/scheduler/AirtelOpenApiStatusPollScheduler.java')
          text = path.read_text()
          text = text.replace('"collectionsPath"', '"collectionPath"')
          text = text.replace('"disbursementsPath"', '"payoutPath"')
          text = text.replace('"disbursementStatusPath"', '"payoutStatusPath"')
          path.write_text(text)
          PY
      - name: Apply canonical Java formatting
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -q spotless:apply
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add InitializrSpringbootProjectFresh
          git commit -m "Format Airtel lifecycle hardening [skip-airtel-format]"
          git push origin HEAD:feature/airtel-money-openapi-hardening-v3
