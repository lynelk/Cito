name: Cito consolidated release preparation

on:
  push:
    branches: [feature/cito-consolidated-release-20260911]
    paths:
      - .github/workflows/consolidated-release-prepare.yml
      - ops/release/consolidate_airtel_20260911.py
      - ops/release/consolidation_records_20260911.py
      - ops/release/consolidation-fixtures/**
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cito-consolidated-release-preparation
  cancel-in-progress: false

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql8:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cpayadmin
          MYSQL_USER: cpay
          MYSQL_PASSWORD: cpay-ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      mysql9:
        image: mysql:9.4
        env:
          MYSQL_DATABASE: cpayadmin
          MYSQL_USER: cpay
          MYSQL_PASSWORD: cpay-ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GH_TOKEN: ${{ github.token }}
      DB_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
      DB_USERNAME: sa
      DB_PASSWORD: ''
      MAIL_USERNAME: noreply@example.com
      MAIL_PASSWORD: ''
      LOCK_FILE_DIR: /tmp/cpay/locks
      ACTUATOR_USERNAME: ci-actuator
      ACTUATOR_PASSWORD: ci-actuator-password
      ADMIN_API_USERNAME: ci-admin
      ADMIN_API_PASSWORD: ci-admin-password
      CALLBACK_SIGNING_SECRET: ci-callback-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clientside/package-lock.json
      - name: Reconcile pinned source inputs without changing any release branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cito-consolidation-evidence
          git config user.name 'Cito release preparation'
          git config user.email 'release-preparation@users.noreply.github.com'
          python3 -m py_compile ops/release/consolidate_airtel_20260911.py ops/release/consolidation_records_20260911.py
          python3 ops/release/consolidate_airtel_20260911.py
          python3 -m pip install --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2 markdown2==2.5.4
          python3 scripts/api_docs/build_portal_reference.py
          python3 scripts/api_docs/build_portal_reference.py --check
          python3 scripts/api_docs/test_portal_reference.py
          python3 Docs/Brand/check_brand.py
          python3 ops/iso/validate_iso_governance.py
      - name: Format and verify all backend tests including real MySQL financial regressions
        working-directory: InitializrSpringbootProjectFresh
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp spotless:apply verify -Ddocker.tests.excludedGroups= -Dspring.flyway.enabled=false > /tmp/cito-consolidation-evidence/backend.log 2>&1 || { tail -120 /tmp/cito-consolidation-evidence/backend.log; exit 1; }
          tail -24 /tmp/cito-consolidation-evidence/backend.log
      - name: Prove populated V125 and V126 upgrade to V130 on MySQL 8.4 and 9.4
        shell: bash
        run: |
          set -euo pipefail
          for image in mysql:8.4 mysql:9.4; do
            id=$(docker ps --filter ancestor=$image --format '{{.ID}}' | head -n1)
            test -n "$id"
            docker exec "$id" mysql -uroot -proot-ci-password -e 'SET GLOBAL log_bin_trust_function_creators=1;'
          done
          cd InitializrSpringbootProjectFresh
          for port in 3306 3307; do
            DB_URL="jdbc:mysql://127.0.0.1:${port}/cpayadmin?allowPublicKeyRetrieval=true&useSSL=false" DB_USERNAME=cpay DB_PASSWORD=cpay-ci-password \
              mvn -B -ntp test -Dtest=FlywayMigrationSmokeTest > "/tmp/cito-consolidation-evidence/mysql-${port}.log" 2>&1 || { tail -120 "/tmp/cito-consolidation-evidence/mysql-${port}.log"; exit 1; }
            tail -22 "/tmp/cito-consolidation-evidence/mysql-${port}.log"
          done
      - name: Verify frontend and public/merchant/admin changes
        working-directory: clientside
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > /tmp/cito-consolidation-evidence/frontend.log 2>&1
          for task in typecheck lint test build; do
            npm run "$task" >> /tmp/cito-consolidation-evidence/frontend.log 2>&1 || { tail -120 /tmp/cito-consolidation-evidence/frontend.log; exit 1; }
          done
          tail -28 /tmp/cito-consolidation-evidence/frontend.log
      - name: Verify edge containment and release-doc integrity
        run: |
          python3 scripts/ci/check-edge-hidden-paths.py
          python3 scripts/api_docs/build_portal_reference.py --check
          python3 -m py_compile ops/release/staging_authenticated_acceptance.py
          git diff --check
      - name: Save tested candidate and publish only a review branch
        shell: bash
        run: |
          set -euo pipefail
          # Temporary source-reconciliation helpers are not part of application runtime.
          rm -rf ops/release/consolidation-fixtures
          rm ops/release/consolidate_airtel_20260911.py ops/release/consolidation_records_20260911.py
          rm .github/workflows/consolidated-release-prepare.yml .github/workflows/consolidation-workspace.yml
          git add -A
          git commit -m 'Consolidate Airtel recovery with one attempt owner, safe migrations and current-main controls' \
            -m 'Includes both PR histories, V129/V130, authoritative status-only finalization, bounded response bodies, strengthened idempotency, merchant/admin/web parity and evidence-limited governance review. Candidate tests precede this source publication. Exact-head PR gates, new staging UAT and completed production backup remain mandatory. No release ref or runtime provider configuration is changed.'
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          branch="release/consolidated-airtel-${GITHUB_RUN_ID}"
          printf '{"candidate":"%s","tree":"%s","branch":"%s","base_main":"de3011367b67eac2cad65e508e72966a3f70b5ea","run_id":"%s","production_promoted":false}\n' "$sha" "$tree" "$branch" "$GITHUB_RUN_ID" > /tmp/cito-consolidation-evidence/manifest.json
          git bundle create /tmp/cito-consolidation-evidence/candidate.bundle HEAD
          git archive --format=tar.gz -o /tmp/cito-consolidation-evidence/source.tar.gz HEAD
          gh auth setup-git
          test "$(gh api repos/lynelk/Cito/branches/main --jq .commit.sha)" = de3011367b67eac2cad65e508e72966a3f70b5ea
          git push origin "HEAD:refs/heads/$branch"
          echo "CANDIDATE_SHA=$sha"
          echo "CANDIDATE_BRANCH=$branch"
          echo 'Main, sandbox and production are unchanged. Exact-head review and release acceptance remain required.'
      - name: Retain source and test evidence, including failures
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cito-consolidated-candidate-${{ github.sha }}
          path: |
            /tmp/cito-consolidation-evidence/
            InitializrSpringbootProjectFresh/target/surefire-reports/
          retention-days: 7
