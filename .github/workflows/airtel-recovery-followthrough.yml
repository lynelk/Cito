name: Airtel recovery followthrough
on:
  push:
    branches: [feature/airtel-recovery-completion-20260910]
    paths: ['.github/workflows/airtel-recovery-followthrough.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply reviewed fixture and merchant guidance changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/ledger/DoubleEntryLedgerServiceTestcontainersTest.java')
          s = p.read_text()
          before = 'new MySQLContainer("mysql:8.0.36")\n'
          assert s.count(before) == 1
          p.write_text(s.replace(before, before + '                    .withCommand("--log-bin-trust-function-creators=1")\n'))
          p = Path('clientside/src/components/modules/merchant/MerchantModuleTransactions.jsx')
          s = p.read_text()
          before = "import Messager from '../../StableMessager';"
          assert s.count(before) == 1
          s = s.replace(before, before + "\nimport PaymentRecoveryNotice from './PaymentRecoveryNotice';")
          before = "                {detailRow('Status', <Badge tone={statusTone(r.status)}>{r.status}</Badge>)}"
          assert s.count(before) == 1
          s = s.replace(before, before + '\n                <PaymentRecoveryNotice status={r.status} />')
          p.write_text(s)
          Path('clientside/src/components/modules/merchant/PaymentRecoveryNotice.jsx').write_text('''import React from 'react';

/** Pending and uncertain outcomes must not encourage duplicate payment submissions. */
export default function PaymentRecoveryNotice({ status }) {
  const value = typeof status === 'string' ? status.trim().toUpperCase() : '';
  if (!['PENDING', 'UNDETERMINED', 'INDETERMINATE'].includes(value)) return null;
  return (
    <p role="status" aria-live="polite">
      Awaiting provider confirmation. Keep the original reference. Do not submit the payment
      again while confirmation is pending. Check its status or contact support before retrying.
    </p>
  );
}
''')
          Path('clientside/src/components/modules/merchant/PaymentRecoveryNotice.test.jsx').write_text('''import React from 'react';
import { cleanup, render, screen } from '@testing-library/react';
import { afterEach, describe, expect, it } from 'vitest';
import PaymentRecoveryNotice from './PaymentRecoveryNotice';

afterEach(cleanup);
describe('PaymentRecoveryNotice', () => {
  it.each(['PENDING', 'UNDETERMINED', 'INDETERMINATE'])('discourages resubmission for %s', (status) => {
    render(<PaymentRecoveryNotice status={status} />);
    const notice = screen.getByRole('status');
    expect(notice.textContent).toContain('Keep the original reference');
    expect(notice.textContent).toContain('Do not submit the payment');
    expect(notice.getAttribute('aria-live')).toBe('polite');
  });
  it.each(['SUCCESSFUL', 'FAILED', undefined])('does not mislabel %s as pending', (status) => {
    render(<PaymentRecoveryNotice status={status} />);
    expect(screen.queryByRole('status')).toBeNull();
  });
});
''')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format fixture
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B -ntp spotless:apply
      - name: Commit changes to the feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/airtel-recovery-followthrough.yml
          git add InitializrSpringbootProjectFresh/src/test/java/net/citotech/cito/ledger/DoubleEntryLedgerServiceTestcontainersTest.java clientside/src/components/modules/merchant
          git diff --cached --check
          git commit -m 'Align merchant pending guidance and real-MySQL trigger-capability fixture'
          git push origin HEAD:refs/heads/feature/airtel-recovery-completion-20260910
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
      - name: Full default backend verification
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B -ntp verify
      - name: Recovery and real ledger database tests
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B -ntp -Ddocker.tests.excludedGroups= -Dtest=AirtelRecoveryStoreTestcontainersTest,DoubleEntryLedgerServiceTestcontainersTest test
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clientside/package-lock.json
      - name: Frontend guidance, typecheck and build
        working-directory: clientside
        run: |
          npm ci
          npm test -- src/components/modules/merchant/PaymentRecoveryNotice.test.jsx
          npm run typecheck
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airtel-recovery-followthrough-evidence
          path: |
            evidence
            InitializrSpringbootProjectFresh/target/surefire-reports
          retention-days: 7
