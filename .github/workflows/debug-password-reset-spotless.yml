name: Debug Password Reset Spotless
on:
  push:
    branches: ["fix/password-reset-recovery-20260908"]
permissions:
  contents: read
jobs:
  spotless:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InitializrSpringbootProjectFresh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply formatter
        run: mvn -B spotless:apply --no-transfer-progress
      - name: Stage formatted sources
        working-directory: .
        run: |
          mkdir -p /tmp/formatted
          cp InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/SendMail.java /tmp/formatted/
          cp InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/security/PasswordResetTokenService.java /tmp/formatted/
          cp InitializrSpringbootProjectFresh/src/main/java/net/citotech/cito/config/PasswordResetSettingsBootstrap.java /tmp/formatted/
      - name: Upload formatted sources
        uses: actions/upload-artifact@v7
        with:
          name: formatted-password-reset-sources
          path: /tmp/formatted/
          retention-days: 1
