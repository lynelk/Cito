name: P0 Spotless Fix

on:
  push:
    branches:
      - fix/admin-api-500s-159

permissions:
  contents: write

jobs:
  apply-spotless:
    if: ${{ !startsWith(github.event.head_commit.message, 'style(p0):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-api-500s-159
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply canonical Spotless formatter
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -q spotless:apply
      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InitializrSpringbootProjectFresh/src/main/java InitializrSpringbootProjectFresh/src/test/java
          git commit -m "style(p0): apply canonical Spotless formatting"
          git push origin HEAD:fix/admin-api-500s-159
