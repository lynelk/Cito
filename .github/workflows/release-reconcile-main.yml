name: Cito reviewed main reconciliation

on:
  push:
    branches: [feature/api-reference-endpoint-billing]
    paths:
      - .github/workflows/release-reconcile-main.yml
      - ops/release/reconcile_api_reference_20260911.py
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cito-reviewed-main-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cpayadmin
          MYSQL_USER: cpay
          MYSQL_PASSWORD: cpay-ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GH_TOKEN: ${{ github.token }}
      DB_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
      DB_USERNAME: sa
      DB_PASSWORD: ''
      MAIL_USERNAME: noreply@example.com
      MAIL_PASSWORD: ''
      LOCK_FILE_DIR: /tmp/cpay/locks
      ACTUATOR_USERNAME: ci-actuator
      ACTUATOR_PASSWORD: ci-actuator-password
      ADMIN_API_USERNAME: ci-admin
      ADMIN_API_PASSWORD: ci-admin-password
      CALLBACK_SIGNING_SECRET: ci-callback-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore existing CI gate when disabled
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh api repos/lynelk/Cito/actions/workflows/ci.yml --jq .state)
          echo "CI_PREVIOUS_STATE=$state"
          if [ "$state" = disabled_manually ] || [ "$state" = disabled_inactivity ]; then
            gh api --method PUT repos/lynelk/Cito/actions/workflows/ci.yml/enable
          fi
          test "$(gh api repos/lynelk/Cito/actions/workflows/ci.yml --jq .state)" = active
          echo CI_GATE_ACTIVE
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clientside/package-lock.json
      - name: Prepare reviewed merge and fresh contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cito release reconciliation'
          git config user.email 'release-reconciliation@users.noreply.github.com'
          python3 -m pip install --quiet PyYAML==6.0.2 openapi-spec-validator==0.7.2 markdown2==2.5.4
          python3 ops/release/reconcile_api_reference_20260911.py
          python3 scripts/api_docs/build_portal_reference.py
          python3 scripts/api_docs/build_portal_reference.py --check
          python3 scripts/api_docs/test_portal_reference.py
          python3 scripts/api_docs/validate_openapi.py InitializrSpringbootProjectFresh/src/main/resources/api-reference/merchant-openapi.json
          python3 Docs/Brand/check_brand.py
      - name: Backend format and complete verification
        working-directory: InitializrSpringbootProjectFresh
        run: mvn -B spotless:apply verify --no-transfer-progress -Dspring.flyway.enabled=false
      - name: MySQL migration and payment lifecycle verification
        shell: bash
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/cpayadmin?allowPublicKeyRetrieval=true&useSSL=false
          DB_USERNAME: cpay
          DB_PASSWORD: cpay-ci-password
          MERCHANT_CHANNEL_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLWtleQ==
          CPAY_KEY_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLWtleQ==
        run: |
          set -euo pipefail
          mysql_container=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -n1)
          test -n "$mysql_container"
          docker exec "$mysql_container" mysql -uroot -proot-ci-password -e 'SET GLOBAL log_bin_trust_function_creators=1;'
          cd InitializrSpringbootProjectFresh
          mvn -B test --no-transfer-progress -Dtest=FlywayMigrationSmokeTest
      - name: Frontend verification
        working-directory: clientside
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test -- src/features/ApiReference.test.tsx src/components/CitoLandingPage.test.tsx
          npm run build
      - name: Publish validated Git objects without moving any branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --stat
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          repo='lynelk/Cito'
          token=os.environ['GH_TOKEN']
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          def api(path,data):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as result:return json.load(result)
          parent=git('rev-parse','HEAD')
          main=git('rev-parse','origin/main')
          assert main=='0ab5bd5cbc919949f132c7e0d6890bcfc38733d3'
          entries=[]
          for filename in git('diff','--cached','--name-only',parent).splitlines():
              if not filename:continue
              staged=git('ls-files','--stage','--',filename)
              if not staged:
                  entries.append({'path':filename,'mode':'100644','type':'blob','sha':None})
                  continue
              mode,_,stage=staged.split('\t')[0].split()
              assert stage=='0'
              blob=api('git/blobs',{'content':base64.b64encode(Path(filename).read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':filename,'mode':mode,'type':'blob','sha':blob['sha']})
          tree=api('git/trees',{'base_tree':git('rev-parse',parent+'^{tree}'),'tree':entries})
          commit=api('git/commits',{'message':'Merge recovered main into API workbench; preserve refund controls and add V128\n\nVerified full backend, fresh contracts, MySQL lifecycle and frontend before publishing this candidate. No runtime data or release branch was changed.','tree':tree['sha'],'parents':[parent,main]})
          print('VALIDATED_CANDIDATE_SHA='+commit['sha'])
          print('EXPECTED_FEATURE_PARENT='+parent)
          print('PINNED_MAIN_SHA='+main)
          print('No refs changed. External exact-head review and release checks are still required.')
          PY
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-reconciliation-reports-${{ github.sha }}
          path: InitializrSpringbootProjectFresh/target/surefire-reports/
