  /api/v2/portal/api-reference/openapi:
    get:
      operationId: merchantApiReferenceOpenapi
      summary: Download merchant OpenAPI contract
      description: Documentation retrieval is free and requires a merchant portal session. No administrator operations
        or unused administrator schemas are included.
      security:
      - MerchantSession: []
      responses:
        '200':
          description: Download merchant OpenAPI contract
          content:
            application/json:
              schema:
                type: object
        '401': &id001
          description: Authentication required
        '403': &id002
          description: Not authorized for this reference
  /api/v2/portal/api-reference/guide:
    get:
      operationId: merchantApiReferenceGuide
      summary: Download the integration guide
      description: Documentation retrieval is free and requires a merchant portal session. No administrator operations
        or unused administrator schemas are included.
      security:
      - MerchantSession: []
      responses:
        '200':
          description: Download the integration guide
          content:
            text/plain:
              schema:
                type: string
        '401': *id001
        '403': *id002
  /api/v2/portal/api-reference/rates:
    get:
      operationId: merchantApiReferenceRates
      summary: List current commercial API access rates
      description: Documentation retrieval is free and requires a merchant portal session. No administrator operations
        or unused administrator schemas are included.
      security:
      - MerchantSession: []
      responses:
        '200':
          description: List current commercial API access rates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401': *id001
        '403': *id002

components:
  securitySchemes:
    CPayV2Signature:
      type: apiKey
      in: header
      name: X-CPay-Signature
      description: Signature-based merchant authentication enforced by the CPay/Cito v2 request security service.
    MerchantSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session established by Cito sign-in. Entitlements are enforced per merchant, service and environment.
  requestBodies:
    GenericJson:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    BadRequest:
      description: Request rejected by validation, entitlement, or business rules
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: A valid Cito merchant session is required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    UnauthorizedSignedRequest:
      description: A valid signed merchant request is required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    DataUnavailable:
      description: Live data is temporarily unavailable; no fallback values were substituted
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    HealthStatus:
      type: object
      required: [status, code, db, release_sha]
      properties:
        status: {type: string, enum: [UP, DOWN, ERROR]}
        code: {type: string, enum: ['000', '503']}
        db: {type: string, enum: [UP, DOWN]}
        pending_transactions: {type: integer, format: int64}
        failed_callbacks: {type: integer, format: int64}
        gateway_mode: {type: string}
        release_sha:
          type: string
          description: Full Railway Git commit SHA, or unknown outside a source deployment.
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
