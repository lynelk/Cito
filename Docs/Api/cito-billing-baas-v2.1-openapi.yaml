      tags:
      - Customers
      operationId: listBillingCustomers
      summary: List Billing Customers
      x-sdk-operation-group: billing.customers
      parameters:
      - $ref: '#/components/parameters/CitoEnvironment'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ObjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-cito-required-scope: BILLING_READ
      description: 'Consumer authentication: X-Cito-Api-Key, explicit X-Cito-Environment, and service-account scope BILLING_READ. Tenant mapping, quotas and independent maker/checker controls remain enforced. No CPay RSA signature is used for this operation.'
    post:
