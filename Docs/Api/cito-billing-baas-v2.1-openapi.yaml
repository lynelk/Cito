openapi: 3.1.0
info:
  title: Cito Billing & Monetization API
  version: 2.1.0
  description: |
    Public Billing-as-a-Service contract for Cito. Requests use X-Cito-Api-Key and explicitly
    select SANDBOX or PRODUCTION with X-Cito-Environment. Production fails closed unless BaaS
    readiness and the Cito BILLING product entitlement are active. Existing CPay payment APIs and
    Cito Billing v2.0 remain compatibility surfaces.
servers:
  - url: /
security:
  - CitoBaasApiKey: []
tags:
  - name: Customers
  - name: Contracts
  - name: Subscriptions
  - name: Pricing
  - name: Charging
  - name: Usage
  - name: Billing Center
  - name: Webhooks
  - name: Exports
  - name: Protected Actions
  - name: Administration
  - name: Revenue Assurance

paths:
  /api/v2/native/billing/baas/customers:
    get:
      tags: [Customers]
      operationId: listBillingCustomers
      summary: List Billing Customers
      x-sdk-operation-group: billing.customers
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      tags: [Customers]
      operationId: createBillingCustomer
      summary: Create Billing Customer
      x-sdk-operation-group: billing.customers
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/accounts:
    post:
      tags: [Customers]
      operationId: createBillingAccount
      summary: Create Billing Account
      x-sdk-operation-group: billing.accounts
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/contracts:
    post:
      tags: [Contracts]
      operationId: createBillingContract
      summary: Create Billing Contract
      x-sdk-operation-group: billing.contracts
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/contracts/{reference}/submit:
    post:
      tags: [Contracts]
      operationId: submitBillingContract
      summary: Submit Billing Contract
      x-sdk-operation-group: billing.contracts
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/contracts/{reference}/approve:
    post:
      tags: [Contracts]
      operationId: approveBillingContract
      summary: Approve Billing Contract
      x-sdk-operation-group: billing.contracts
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/contracts/{reference}/activate:
    post:
      tags: [Contracts]
      operationId: activateBillingContract
      summary: Activate Billing Contract
      x-sdk-operation-group: billing.contracts
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/contracts/{reference}/price-overrides:
    post:
      tags: [Contracts, Pricing]
      operationId: submitContractPriceOverride
      summary: Submit Contract Price Override
      x-sdk-operation-group: billing.pricing
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/price-overrides/{overrideId}/approve:
    post:
      tags: [Contracts, Pricing]
      operationId: approveContractPriceOverride
      summary: Approve Contract Price Override
      x-sdk-operation-group: billing.pricing
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: overrideId, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/subscriptions:
    post:
      tags: [Subscriptions]
      operationId: createBillingSubscription
      summary: Create Billing Subscription
      x-sdk-operation-group: billing.subscriptions
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/subscriptions/{reference}/activate:
    post:
      tags: [Subscriptions]
      operationId: activateBillingSubscription
      summary: Activate Billing Subscription
      x-sdk-operation-group: billing.subscriptions
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/subscriptions/{reference}/pause:
    post:
      tags: [Subscriptions]
      operationId: pauseBillingSubscription
      summary: Pause Billing Subscription
      x-sdk-operation-group: billing.subscriptions
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/subscriptions/{reference}/cancel:
    post:
      tags: [Subscriptions]
      operationId: cancelBillingSubscription
      summary: Cancel Billing Subscription
      x-sdk-operation-group: billing.subscriptions
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/subscriptions/{reference}/entitlements:
    post:
      tags: [Subscriptions]
      operationId: grantBillingEntitlement
      summary: Grant Billing Entitlement
      x-sdk-operation-group: billing.entitlements
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/pricing/quotes:
    post:
      tags: [Pricing]
      operationId: quoteBillingPrice
      summary: Quote Billing Price
      description: Resolves effective contract override, customer price, provider cost, tax and FX without reserving funds.
      x-sdk-operation-group: billing.pricing
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/charges:
    post:
      tags: [Charging]
      operationId: authorizeBillingChargeCompatibility
      summary: Authorize Billing Charge Compatibility
      description: Compatibility route accepting caller-supplied net amount. New integrations should use rate-and-authorize.
      x-sdk-operation-group: billing.charging
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/charges/rate-and-authorize:
    post:
      tags: [Charging, Pricing]
      operationId: rateAndAuthorizeBillingCharge
      summary: Rate And Authorize Billing Charge
      description: Preferred server-side deterministic pricing and online authorization path.
      x-sdk-operation-group: billing.charging
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/charges/{reference}:
    get:
      tags: [Charging]
      operationId: getBillingCharge
      summary: Get Billing Charge
      x-sdk-operation-group: billing.charging
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/charges/{reference}/commit:
    post:
      tags: [Charging]
      operationId: commitBillingCharge
      summary: Commit Billing Charge
      x-sdk-operation-group: billing.charging
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/charges/{reference}/release:
    post:
      tags: [Charging]
      operationId: releaseBillingCharge
      summary: Release Billing Charge
      x-sdk-operation-group: billing.charging
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/charges/{reference}/reverse:
    post:
      tags: [Charging, Protected Actions]
      operationId: reverseBillingCharge
      summary: Reverse Billing Charge
      x-sdk-operation-group: billing.charging
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Reference'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/usage/events:
    post:
      tags: [Usage]
      operationId: ingestBillingUsageEvent
      summary: Ingest Billing Usage Event
      x-sdk-operation-group: billing.usage
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UsageEventRequest'}}}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    get:
      tags: [Usage]
      operationId: listBillingUsageEvents
      summary: List Billing Usage Events
      x-sdk-operation-group: billing.usage
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: serviceCode, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/usage/summary:
    get:
      tags: [Usage]
      operationId: summarizeBillingUsage
      summary: Summarize Billing Usage
      x-sdk-operation-group: billing.usage
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/invoices:
    get:
      tags: [Billing Center]
      operationId: listBillingInvoices
      summary: List Billing Invoices
      x-sdk-operation-group: billing.invoices
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/invoices/{invoiceNumber}:
    get:
      tags: [Billing Center]
      operationId: getBillingInvoice
      summary: Get Billing Invoice
      description: Returns invoice header, lines, credit notes, payment allocations and retained tax evidence.
      x-sdk-operation-group: billing.invoices
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: invoiceNumber, in: path, required: true, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/quotas:
    get:
      tags: [Billing Center]
      operationId: getBillingQuotaUsage
      summary: Get Billing Quota Usage
      x-sdk-operation-group: billing.quotas
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/entitlements:
    get:
      tags: [Billing Center]
      operationId: listBillingEntitlements
      summary: List Billing Entitlements
      x-sdk-operation-group: billing.entitlements
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/catalog:
    get:
      tags: [Billing Center]
      operationId: getBillingCatalog
      summary: Get Billing Catalog
      x-sdk-operation-group: billing.catalog
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: asOf, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/protected-actions:
    post:
      tags: [Protected Actions]
      operationId: requestBillingProtectedAction
      summary: Request Billing Protected Action
      x-sdk-operation-group: billing.protectedActions
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/protected-actions/{id}/approve:
    post:
      tags: [Protected Actions]
      operationId: approveBillingProtectedAction
      summary: Approve Billing Protected Action
      x-sdk-operation-group: billing.protectedActions
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {$ref: '#/components/requestBodies/OptionalJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/webhooks/events:
    get:
      tags: [Webhooks]
      operationId: listBillingWebhookEventTypes
      summary: List Billing Webhook Event Types
      x-sdk-operation-group: billing.webhooks
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/webhooks:
    get:
      tags: [Webhooks]
      operationId: listBillingWebhooks
      summary: List Billing Webhooks
      x-sdk-operation-group: billing.webhooks
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      tags: [Webhooks]
      operationId: createBillingWebhook
      summary: Create Billing Webhook
      x-sdk-operation-group: billing.webhooks
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/webhooks/{endpointId}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateBillingWebhookSecret
      summary: Rotate Billing Webhook Secret
      x-sdk-operation-group: billing.webhooks
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: endpointId, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/webhooks/deliveries:
    get:
      tags: [Webhooks]
      operationId: listBillingWebhookDeliveries
      summary: List Billing Webhook Deliveries
      x-sdk-operation-group: billing.webhooks
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses: {'200': {$ref: '#/components/responses/ObjectList'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/webhooks/deliveries/{deliveryId}/replay:
    post:
      tags: [Webhooks]
      operationId: replayBillingWebhookDelivery
      summary: Replay Billing Webhook Delivery
      x-sdk-operation-group: billing.webhooks
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: deliveryId, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/webhooks/test:
    post:
      tags: [Webhooks]
      operationId: testBillingWebhook
      summary: Test Billing Webhook
      x-sdk-operation-group: billing.webhooks
      parameters: [{$ref: '#/components/parameters/CitoEnvironment'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}

  /api/v2/native/billing/baas/exports/focus:
    get:
      tags: [Exports]
      operationId: exportBillingFocus14CostAndUsage
      summary: Export Billing Focus14 Cost And Usage
      description: Tenant-scoped FOCUS 1.4 Cost and Usage CSV with separate Cito provider-cost provenance columns.
      x-sdk-operation-group: billing.exports
      parameters:
        - {$ref: '#/components/parameters/CitoEnvironment'}
        - {$ref: '#/components/parameters/RequestId'}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: FOCUS 1.4 Cost and Usage CSV
          headers:
            X-Cito-FOCUS-Version:
              schema: {type: string, const: '1.4'}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v2/admin/billing/baas/tenants/{tenantId}/profile:
    get:
      tags: [Administration]
      operationId: getBillingBaasTenantReadiness
      summary: Get Billing Baas Tenant Readiness
      security: [{AdminBasicAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses: {'200': {$ref: '#/components/responses/Object'}}

  /api/v2/admin/billing/baas/tenants/{tenantId}/profile/review:
    post:
      tags: [Administration]
      operationId: reviewBillingBaasTenantReadiness
      summary: Review Billing Baas Tenant Readiness
      security: [{AdminBasicAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}}

  /api/v2/admin/billing/baas/tenants/{tenantId}/profile/activate:
    post:
      tags: [Administration]
      operationId: activateBillingBaasTenant
      summary: Activate Billing Baas Tenant
      security: [{AdminBasicAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}}

  /api/v2/admin/billing/baas/tenants/{tenantId}/credentials:
    post:
      tags: [Administration]
      operationId: provisionBillingBaasCredential
      summary: Provision Billing Baas Credential
      security: [{AdminBasicAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/BadRequest'}}

  /api/v2/admin/billing/baas/tenants/{tenantId}/accounts/{accountReference}/credit-limit:
