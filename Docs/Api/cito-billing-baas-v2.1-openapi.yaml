openapi: 3.1.0
info:
  title: Cito Billing & Monetization API
  version: 2.1.1
  description: 'Public Billing-as-a-Service contract for Cito. Requests use X-Cito-Api-Key and explicitly

    select SANDBOX or PRODUCTION with X-Cito-Environment. Production fails closed unless BaaS

    readiness and the Cito BILLING product entitlement are active. Existing CPay payment APIs and

    Cito Billing v2.0 remain compatibility surfaces.

    '
servers:
- url: /
security:
- CitoBaasApiKey: []
tags:
- name: Customers
- name: Contracts
- name: Subscriptions
- name: Pricing
- name: Charging
- name: Usage
- name: Billing Center
- name: Webhooks
- name: Exports
- name: Protected Actions
- name: Administration
- name: Revenue Assurance
paths:
