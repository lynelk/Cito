webhooks:
  invoiceIssued:
    post:
      operationId: receiveBillingInvoiceIssuedWebhook
      summary: Example outbound invoice.issued webhook
      parameters:
        - {name: X-CPay-Event, in: header, required: true, deprecated: true, schema: {type: string, const: invoice.issued}}
        - {name: X-CPay-Reference, in: header, required: true, deprecated: true, schema: {type: string}}
        - {name: X-CPay-Signature, in: header, required: true, deprecated: true, schema: {type: string}}
      requestBody: {$ref: '#/components/requestBodies/GenericJson'}
      responses:
        '2XX': {description: Receiver accepted webhook}

components:
  securitySchemes:
    CitoBaasApiKey:
      type: apiKey
      in: header
      name: X-Cito-Api-Key
    AdminBasicAuth:
      type: http
      scheme: basic
  parameters:
    CitoEnvironment:
      name: X-Cito-Environment
      in: header
      required: true
      schema: {type: string, enum: [SANDBOX, PRODUCTION]}
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: {type: string, maxLength: 191}
    Reference:
      name: reference
      in: path
      required: true
      schema: {type: string, maxLength: 160}
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  requestBodies:
    GenericJson:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GenericObject'}
    OptionalJson:
      required: false
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GenericObject'}
  responses:
    Object:
      description: Successful response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GenericObject'}
    ObjectList:
      description: Successful list response
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/GenericObject'}
    BadRequest:
      description: Validation or protected business rule rejected the request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: 'Credential, scope, environment or product entitlement rejected the request'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    UsageEventRequest:
      type: object
      required: [serviceCode, meterCode, quantity, sourceReference, idempotencyKey]
      properties:
        serviceCode: {type: string}
        meterCode: {type: string}
        eventTime: {type: [string, 'null'], format: date-time}
        quantity: {type: number, exclusiveMinimum: 0}
        currency: {type: [string, 'null']}
        dimensions:
          type: object
          additionalProperties: {type: string}
        sourceReference: {type: string}
        idempotencyKey: {type: string}
