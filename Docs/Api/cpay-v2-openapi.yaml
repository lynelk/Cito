openapi: 3.0.3
info:
  title: CPay Gateway API
  version: 1.9.1
  description: Merchant payment, callback operations, reconciliation, finance, and operations endpoints for CPay. Includes P1-P4 production maturity finance, compliance, cross-border, developer-experience, and automation surfaces.
servers:
  - url: /
    description: Current CPay deployment host
security:
- CPayV2Signature: []
paths:
  /api/doMobileMoneyRefund:
    post:
      operationId: legacyMobileMoneyRefund
      summary: Refund the remaining collection balance through the compatibility API
      description: 'Compatibility endpoint for a successful production PAYIN owned by the merchant. The
        original payer and gateway determine the compensating payout for the remaining unrefunded amount.
        The shared refund lifecycle enforces cumulative limits, idempotency and independent approval
        before any payout. The callback destination is retained across approval. Authentication is the required
        JSON-body signature: RSA-SHA256 or HMAC-SHA256 over merchant_number + original_reference + reference
        + description using the merchant configured signing method. This is not the v2 signature-header
        protocol. Acceptance or a pending response does not prove provider settlement. Use the v2 refund
        resource for partial refund amounts and lifecycle tracking. The response adds refundReference
        and refundStatus; only COMPLETED proves a successful refund.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - merchant_number
              - original_reference
              - reference
              - description
              - callback_url
              - signature
              properties:
                merchant_number:
                  type: string
                  description: Merchant account number.
                original_reference:
                  type: string
                  description: Original successful production collection reference.
                reference:
                  type: string
                  description: Unique merchant reference for this refund payout.
                description:
                  type: string
                  description: Refund reason; included in the signature.
                callback_url:
                  type: string
                  description: Callback destination, or an empty string when unused.
                signature:
                  type: string
                  description: Base64-encoded signature of the legacy concatenated request fields.
      responses:
        '200':
          description: Legacy JSON payment or error envelope. Inspect its result and transaction status;
            HTTP 200 alone is not successful settlement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          description: Merchant rate limit exceeded.
  /api/v2/native/payments/collect:
    post:
      summary: Submit an adapter-native mobile money collection request
      operationId: nativeCollect
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '202':
          description: Payment accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/native/payments/payout:
    post:
      summary: Submit an adapter-native mobile money payout request
      operationId: nativePayout
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '202':
          description: Payout accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/channels:
    get:
      summary: List supported payment channels
      operationId: listChannels
      responses:
        '200':
          description: Supported channels
  /api/v2/fx/quotes:
    post:
      summary: Request a foreign-exchange quote for a cross-border transfer
      operationId: createFxQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxQuoteRequest'
      responses:
        '201':
          description: FX quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxQuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/cross-border/transfers:
    post:
      summary: Create a cross-border transfer intent from an accepted FX quote
      operationId: createCrossBorderTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferIntentRequest'
      responses:
        '201':
          description: Transfer intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/webhooks/events:
    get:
      summary: List the versioned webhook event catalog with payload schemas
      operationId: listWebhookEvents
      responses:
        '200':
          description: Webhook event catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookEventCatalogEntry'
  /api/v2/payments/{reference}:
    get:
      summary: Check transaction status
      operationId: transactionStatus
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: merchantNumber
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Transaction status
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/accounts/validate:
    post:
      summary: Validate an account name before payout
      operationId: validateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountValidationRequest'
      responses:
        '200':
          description: Account validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/payment-links:
    post:
      summary: Create a hosted checkout payment link
      operationId: createPaymentLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkCreateRequest'
      responses:
        '201':
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/checkout/{token}/pay:
    post:
      summary: Submit a hosted checkout payment
      operationId: payHostedCheckout
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedCheckoutPayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HostedCheckoutPayRequest'
      responses:
        '202':
          description: Hosted checkout accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/invoices:
    post:
      summary: Create an invoice / request-to-pay
      operationId: createInvoice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List invoices for a merchant
      operationId: listInvoices
      parameters:
        - name: merchantNumber
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/invoices/{reference}/actions/send:
    post:
      summary: Send an invoice to its payer
      operationId: sendInvoice
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
        - name: merchantNumber
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invoice sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/invoices/{reference}/actions/cancel:
    post:
      summary: Cancel an invoice
      operationId: cancelInvoice
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
        - name: merchantNumber
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invoice cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/invoices/pay/{token}:
    get:
      summary: View an invoice by payment token (public)
      operationId: viewInvoiceByToken
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invoice view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          description: Invoice not found
    post:
      summary: Pay an invoice (public hosted payment)
      operationId: payInvoice
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedCheckoutPayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HostedCheckoutPayRequest'
      responses:
        '202':
          description: Invoice payment accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/statements:
    get:
      summary: Export merchant statement rows
      operationId: exportMerchantStatements
      parameters:
      - name: merchantNumber
        in: query
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
      responses:
        '200':
          description: Merchant statement export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementExportResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/admin/balances/sync-legacy:
    post:
      summary: Backfill normalized balances from legacy balances
      operationId: syncLegacyBalances
      security:
      - AdminBasicAuth: []
      responses:
        '200':
          description: Backfill result
  /api/v2/admin/callback-admin/retry-task:
    post:
      summary: Requeue one parked callback task
      operationId: retryCallbackTask
      security:
      - AdminBasicAuth: []
      parameters:
      - name: taskId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Updated count
  /api/v2/admin/provider-sandbox/run:
    post:
      summary: Record and run a provider sandbox scenario
      operationId: providerSandboxRun
      security:
      - AdminBasicAuth: []
      parameters:
      - name: channel
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sandbox run id
  /api/v2/admin/statements/check:
    post:
      summary: Validate a provider statement file before import
      operationId: validateProviderStatement
      security:
      - AdminBasicAuth: []
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Statement validation run id
  /api/v2/admin/reconciliation/reviews/request:
    post:
      summary: Request a reconciliation review (maker step)
      operationId: requestReconciliationReview
      security:
      - AdminBasicAuth: []
      parameters:
      - name: recordId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: transactionId
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: true
        schema:
          type: string
      - name: amount
        in: query
        required: true
        schema:
          type: string
      - name: currency
        in: query
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: true
        schema:
          type: string
      - name: requestedBy
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Review requested
  /api/v2/admin/reconciliation/reviews/pending:
    get:
      summary: List pending reconciliation reviews
      operationId: pendingReconciliationReviews
      security:
      - AdminBasicAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: Pending reconciliation reviews
  /api/v2/admin/reconciliation/reviews/approve:
    post:
      summary: Approve a reconciliation review (checker step)
      operationId: approveReconciliationReview
      security:
      - AdminBasicAuth: []
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: reviewedBy
        in: query
        required: true
        schema:
          type: string
      - name: note
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Review approved
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/reviews/reject:
    post:
      summary: Reject a reconciliation review (checker step)
      operationId: rejectReconciliationReview
      security:
      - AdminBasicAuth: []
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: reviewedBy
        in: query
        required: true
        schema:
          type: string
      - name: note
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Review rejected
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/import:
    post:
      summary: Import a provider statement file (CSV or XLSX)
      operationId: importProviderStatement
      security:
      - AdminBasicAuth: []
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
      - name: importedBy
        in: query
        required: false
        schema:
          type: string
          default: system
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import run id
  /api/v2/admin/reconciliation/auto-match:
    post:
      summary: Run automatic reconciliation matching
      operationId: autoMatchReconciliation
      security:
      - AdminBasicAuth: []
      responses:
        '200':
          description: Number of records matched
  /api/v2/admin/reconciliation/unmatched:
    get:
      summary: List unmatched reconciliation records
      operationId: unmatchedReconciliationRecords
      security:
      - AdminBasicAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: Unmatched reconciliation records
  /api/v2/admin/reconciliation/manual-match:
    post:
      summary: Manually match a reconciliation record to a transaction
      operationId: manualMatchReconciliation
      security:
      - AdminBasicAuth: []
      parameters:
      - name: recordId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: transactionId
        in: query
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Match recorded
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/candidate-transactions:
    get:
      summary: Search candidate CPay transactions for the manual-match workbench
      operationId: candidateTransactions
      security:
      - AdminBasicAuth: []
      parameters:
      - name: reference
        in: query
        required: false
        schema:
          type: string
      - name: amount
        in: query
        required: false
        schema:
          type: string
      - name: currency
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: Candidate transactions
  /api/v2/admin/recon-finance/post:
    post:
      summary: Post approved reconciliation reviews into the ledger
      operationId: postApprovedReconciliationReviews
      security:
      - AdminBasicAuth: []
      parameters:
      - name: reviewId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: postedBy
        in: query
        required: false
        schema:
          type: string
          default: system
      responses:
        '200':
          description: Posting result
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/open:
    post:
      summary: Open a settlement batch
      operationId: openSettlementBatch
      security:
      - AdminBasicAuth: []
      parameters:
      - name: reference
        in: query
        required: true
        schema:
          type: string
      - name: provider
        in: query
        required: true
        schema:
          type: string
      - name: channel
        in: query
        required: true
        schema:
          type: string
      - name: currency
        in: query
        required: true
        schema:
          type: string
      - name: expectedAmount
        in: query
        required: true
        schema:
          type: string
      - name: openedBy
        in: query
        required: false
        schema:
          type: string
          default: system
      responses:
        '200':
          description: Batch opened
  /api/v2/admin/reconciliation/settlements/flag-record:
    post:
      summary: Flag a settlement record for follow-up
      operationId: flagSettlementRecord
      security:
      - AdminBasicAuth: []
      parameters:
      - name: recordId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: category
        in: query
        required: true
        schema:
          type: string
      - name: batchReference
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Flag update result
  /api/v2/admin/recon-finance/summary:
    get:
      summary: Get reconciliation finance summary
      operationId: reconciliationFinanceSummary
      security:
      - AdminBasicAuth: []
      responses:
        '200':
          description: Finance summary
  /api/v2/admin/recon-finance/close:
    post:
      summary: Submit a reconciliation daily close for maker-checker approval (maker step)
      operationId: reconciliationDailyClose
      security:
      - AdminBasicAuth: []
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: currency
        in: query
        required: false
        schema:
          type: string
          default: UGX
      - name: submittedBy
        in: query
        required: false
        schema:
          type: string
          default: system
      responses:
        '200':
          description: Daily close row id in PENDING_APPROVAL
  /api/v2/admin/recon-finance/close/approve:
    post:
      summary: Checker approval for a submitted daily close
      operationId: approveReconciliationDailyClose
      security:
      - AdminBasicAuth: []
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: currency
        in: query
        required: false
        schema:
          type: string
          default: UGX
      - name: approvedBy
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Daily close approved and closed
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/recon-finance/close/reject:
    post:
      summary: Checker rejection for a submitted daily close
      operationId: rejectReconciliationDailyClose
      security:
      - AdminBasicAuth: []
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: currency
        in: query
        required: false
        schema:
          type: string
          default: UGX
      - name: rejectedBy
        in: query
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Daily close marked rejected and left pending for re-submit
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/close/approve:
    post:
      summary: Checker approval for a submitted settlement batch close
      operationId: approveSettlementBatchClose
      security:
      - AdminBasicAuth: []
      parameters:
      - name: reference
        in: query
        required: true
        schema:
          type: string
      - name: approvedBy
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Settlement batch closed
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/reconciliation/settlements/close/reject:
    post:
      summary: Checker rejection for a submitted settlement batch close
      operationId: rejectSettlementBatchClose
      security:
      - AdminBasicAuth: []
      parameters:
      - name: reference
        in: query
        required: true
        schema:
          type: string
      - name: rejectedBy
        in: query
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Settlement batch marked rejected and left pending
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/admin/webhooks/merchants/{merchantId}:
    post:
      summary: Register a merchant webhook endpoint
      operationId: registerMerchantWebhook
      security:
      - AdminBasicAuth: []
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - eventType
              - endpointUrl
              properties:
                eventType:
                  type: string
                endpointUrl:
                  type: string
                actor:
                  type: string
      responses:
        '201':
          description: Webhook endpoint registered
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      summary: List a merchant's webhook endpoints
      operationId: listMerchantWebhooks
