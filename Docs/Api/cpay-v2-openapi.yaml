components:
  securitySchemes:
    CPayV2Signature:
      type: apiKey
      in: header
      name: X-CPay-Signature
    AdminBasicAuth:
      type: http
      scheme: basic
    AdminSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    IdempotencyKey:
      name: X-CPay-Idempotency-Key
      in: header
      required: false
      description: >-
        Merchant-scoped request identity. Identical requests replay their stored result;
        different bodies conflict. Failed request cleanup replays REQUEST_FAILED without
        releasing the key. Abandoned claims recover after 15 minutes. Check the payment
        reference before using a new key; REQUEST_FAILED does not prove provider failure.
      schema:
        type: string
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    MerchantIdPath:
      in: path
      name: merchantId
      required: true
      schema:
        type: integer
        format: int64
    SettlementBatchId:
      name: settlementBatchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CorridorCode:
      name: corridorCode
      in: path
      required: true
      schema:
        type: string
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    PaymentParty:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
    PaymentRequest:
      type: object
      required:
      - merchantNumber
      - country
      - currency
      - amount
      - reference
      - description
      - callbackUrl
      properties:
        merchantNumber:
          type: string
        channel:
          type: string
        country:
          type: string
        currency:
          type: string
        amount:
          type: string
        reference:
          type: string
        description:
          type: string
        callbackUrl:
          type: string
        payer:
          $ref: '#/components/schemas/PaymentParty'
        payee:
          $ref: '#/components/schemas/PaymentParty'
    PaymentResult:
      type: object
      description: >-
        Payment lifecycle result. REQUEST_FAILED represents an incomplete API request,
        not a terminal provider outcome; query the reference before retrying.
      properties:
        reference:
          type: string
        transactionId:
          type: string
        status:
          type: string
        channel:
          type: string
        currency:
          type: string
        message:
          type: string
        providerResponse:
          type: string
    FxQuoteRequest:
      type: object
      required:
      - merchantNumber
      - sourceCurrency
      - targetCurrency
      - sourceAmount
      properties:
        merchantNumber:
          type: string
        sourceCurrency:
          type: string
        targetCurrency:
          type: string
        sourceAmount:
          type: string
    FxQuoteResponse:
      type: object
      properties:
        quoteReference:
          type: string
        sourceCurrency:
          type: string
        targetCurrency:
          type: string
        sourceAmount:
          type: string
        targetAmount:
          type: string
        rate:
          type: string
        expiresAt:
          type: string
          format: date-time
    TransferIntentRequest:
      type: object
      required:
      - quoteReference
      - sourceCountry
      - targetCountry
      - sourceCurrency
      - targetCurrency
      - sourceAmount
      - beneficiaryAccount
      - beneficiaryName
      properties:
        merchantNumber:
          type: string
        quoteReference:
          type: string
        sourceCountry:
          type: string
        targetCountry:
          type: string
        sourceCurrency:
          type: string
        targetCurrency:
          type: string
        sourceAmount:
          type: string
        beneficiaryAccount:
          type: string
        beneficiaryName:
          type: string
        description:
          type: string
    TransferIntentResponse:
      type: object
      properties:
        transferReference:
          type: string
        status:
          type: string
        message:
          type: string
    WebhookEventCatalogEntry:
      type: object
      properties:
        eventType:
          type: string
        version:
          type: integer
        qualifiedType:
          type: string
        description:
          type: string
        schema:
          type: object
    AccountValidationRequest:
      type: object
      required:
      - merchantNumber
      - msisdn
      properties:
        merchantNumber:
          type: string
        msisdn:
          type: string
    AccountValidationResponse:
      type: object
      properties:
        msisdn:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        name:
          type: string
        status:
          type: string
    PaymentLinkCreateRequest:
      type: object
      required:
      - merchantNumber
      - amount
      - currency
      - description
      properties:
        merchantNumber:
          type: string
        amount:
          type: string
        currency:
          type: string
        country:
          type: string
        reference:
          type: string
        description:
          type: string
        callbackUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
    PaymentLinkResponse:
      type: object
      properties:
        linkReference:
          type: string
        checkoutUrl:
          type: string
        status:
          type: string
        amount:
          type: string
        currency:
          type: string
        description:
          type: string
        expiresAt:
          type: string
          format: date-time
    HostedCheckoutPayRequest:
      type: object
      required:
      - payerAccount
      properties:
        payerAccount:
          type: string
        channel:
          type: string
    StatementExportResponse:
      type: object
      properties:
        merchantNumber:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        count:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/StatementRow'
    StatementRow:
