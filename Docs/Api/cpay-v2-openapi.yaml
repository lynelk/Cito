        transactionReference:
          type: string
        providerReference:
          type: string
        merchantReference:
          type: string
        transactionType:
          type: string
        status:
          type: string
        amount:
          type: number
        feeAmount:
          type: number
        taxAmount:
          type: number
        netAmount:
          type: number
        varianceAmount:
          type: number
    TreasuryPositionRequest:
      type: object
      required:
      - currencyCode
      - positionDate
      properties:
