custom.gatewaystate=${CUSTOM_GATEWAYSTATE:PRODUCTION}
cpay.security.nonce-store=${CPAY_SECURITY_NONCE_STORE:jdbc}
cpay.legacy-dbchanges.enabled=false
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
# Production browser sessions must never traverse plaintext HTTP.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Audit E10: the default CSP connect-src carve-out is the local Vite dev server target only;
# production ships no localhost allowance in the CSP it sends to browsers.
csp.connect-src.extra=

# Container runtime lock files must use a writable ephemeral directory.
custom.lockfiledirectory=${CUSTOM_LOCKFILEDIRECTORY:/tmp/}
